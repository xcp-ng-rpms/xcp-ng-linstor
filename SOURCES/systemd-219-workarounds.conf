# In the version of systemd used by XCP-ng 8.3 (219), we do not have support
# for the `DynamicUser` feature (systemd >= 232) nor the `ConfigurationDirectory`
# feature (systemd >= 235).
#
# TODO(XCPNG-3990): Remove this file when supporting systemd >= 235 in XCP-ng.

[Service]
# Use the root user as previous versions of LINSTOR did since dynamic users is
# not supported here.
User=root
Group=root

Environment="CONFIGURATION_DIRECTORY=/etc/linstor"
